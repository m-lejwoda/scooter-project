services:
  web:
    build: .
    container_name: web
    ports:
      - 8080:8080
    env_file: ".env"
    volumes:
      - .:/app
    working_dir: /app/scooter-prj
    command: air --build.cmd "go build -o ./tmp/main ./cmd/api/main.go" --build.bin "./tmp/main"
    depends_on:
      redis:
        condition: service_healthy
        restart: true
      db:
        condition: service_healthy
        restart: true
  db:
    image: postgis/postgis:18-3.6
    container_name: db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file: ".env"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d scooter_db"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 10s
  redis:
    image: redis:8.8.0
    container_name: "redis"
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prom_data:/prometheus
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    env_file: ".env"
    restart: unless-stopped
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources

volumes:
  redis_data:
  postgres_data:
  prom_data:
